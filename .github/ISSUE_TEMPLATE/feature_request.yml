name: 💡 Feature Request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        Please describe the problem you are trying to solve, not only the feature you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation does this feature solve?
      placeholder: What is currently difficult or impossible to do?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe how you think the framework could solve this problem.
      placeholder: What would you like the framework to provide?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have tried.
      placeholder: Have you solved this another way?

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the framework would this feature affect?
      options:
        - telegram-bot-core
        - telegram-bot-spring-boot
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, code snippets, screenshots, or other relevant information.