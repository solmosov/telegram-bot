name: ❓ Question
description: Ask a question about using or configuring the framework
title: "[Question]: "
labels:
  - question

body:
  - type: markdown
    attributes:
      value: |
        Before opening a question, please check the documentation and existing issues.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Clearly describe what you need help with.
      placeholder: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide relevant code, configuration, or project details.
      placeholder: |
        I'm trying to ...
        My configuration is ...
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version
      placeholder: e.g. 1.0.0-beta.1
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: e.g. 21.0.8
    validations:
      required: true

  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot version
      description: Required if you are using the Spring Boot module.
      placeholder: e.g. 4.1.0

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the framework are you using?
      options:
        - telegram-bot-core
        - telegram-bot-spring-boot
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Describe what you have already tried and what happened.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help.